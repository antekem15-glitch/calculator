<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="myscript.js" defer></script>
</head>
<body>
    <div class="calcBody">
        
            <input readonly id="display">
       
        
        
        <div class="numbers">
            
            
            <button class="red"   id="delete">DEL</button>
            <button class="red"   id="clear">C</button>
            <button class="blue"  id="percent">%</button>
            <button class="blue"  id="plus">+</button>
            <button               id="seven">7</button>
            <button               id="eight">8</button>
            <button               id="nine">9</button>
            <button class="blue"  id="minus">-</button>
            <button               id="four">4</button>
            <button               id="five">5</button>
            <button               id="six">6</button>
            <button class="blue">x</button>
            <button               id="one">1</button>
            <button               id="two">2</button>
            <button               id="three">3</button>
            <button class="blue"  id="divide">/</button>
            <button class="zero"  id="zero">0</button>
            <button               id="dot">.</button>
            <button class="green" id="sum">=</button>
            



        </div>





    </div>




</body>
</html>
